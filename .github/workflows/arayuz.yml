name: arayuz
on:
  push:
    paths:
      - 'kaynak.enc'
      - 'ui_kontrol.py'
      - '.github/workflows/arayuz.yml'
  workflow_dispatch:
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kaynagi coz
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in kaynak.enc -out k.tar.gz -k "${{ secrets.PAKET_SIFRE }}"
          tar -xzf k.tar.gz
      - name: ARAYUZ KONTROLU (buton/sekme/JS/uc)
        run: python3 ui_kontrol.py
