name: inno
on: [push, workflow_dispatch]
jobs:
  i:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: coz
        shell: pwsh
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in kaynak.enc -out k.tar.gz -k ${{ secrets.PAKET_SIFRE }}
          tar -xzf k.tar.gz
      - name: Inno kur
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Kurulum paketi derle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path paket | Out-Null
          Copy-Item CWPS.exe paket\
          Copy-Item CWPS.iss paket\
          if (Test-Path OKU-BENI.txt) { Copy-Item OKU-BENI.txt paket\ }
          if (Test-Path araclar) { Copy-Item -Recurse araclar paket\araclar }
          if (Test-Path listeler) { Copy-Item -Recurse listeler paket\listeler }
          cd paket
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" CWPS.iss | Select-Object -Last 8
          Get-ChildItem Output | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: CWPS-Setup
          path: paket/Output/CWPS-Setup.exe
