name: WINDOWS-TESTI
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kaynagi coz (sifreli)
        shell: bash
        run: |
          printf %s "${{ secrets.PAKET_SIFRE }}" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in kaynak.enc -out kaynak.tar.gz -pass stdin
          tar xzf kaynak.tar.gz && ls -la motor.cpp dis.cpp
      - name: MinGW kur
        run: choco install mingw -y --no-progress
      - name: ARAC TESTI (gomulu araclar Windows'ta calisiyor mu)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/ffuf/ffuf/releases/download/v2.1.0/ffuf_2.1.0_windows_amd64.zip" -OutFile ffuf.zip
          Expand-Archive ffuf.zip -DestinationPath .
          Write-Host "=== FFUF ==="; .\ffuf.exe -V 2>&1 | Select-Object -First 3
          Invoke-WebRequest -Uri "https://github.com/OJ/gobuster/releases/download/v3.6.0/gobuster_Windows_x86_64.zip" -OutFile gb.zip
          New-Item -ItemType Directory -Path gb -Force | Out-Null; Expand-Archive gb.zip -DestinationPath gb
          Write-Host "=== GOBUSTER ==="; .\gb\gobuster.exe version 2>&1 | Select-Object -First 2
      - name: Derle
        shell: bash
        run: |
          g++ -O2 -std=c++17 -DWIN32_LEAN_AND_MEAN -o motor.exe motor.cpp main.cpp -lws2_32 -ladvapi32 -lcrypt32 -lole32 -luuid -lshell32 -liphlpapi -lwininet -lcomctl32 -lgdi32
      - name: CALISTIR ve UCLARI TEST ET
        shell: pwsh
        run: |
          Start-Process -FilePath .\motor.exe -NoNewWindow -RedirectStandardOutput motor.log
          Start-Sleep -Seconds 5
          $t = "cwps-yerel-9f3a7d"
          $uclar = @("durum","tara?h=scanme.nmap.org&p1=1&p2=1000&th=3000","tara?h=scanme.nmap.org&p1=1&p2=100&th=1024")
          $ok=0; $hata=0
          foreach ($u in $uclar) {
            $sep = "?"; if ($u.Contains("?")) { $sep = "&" }
            $url = "http://127.0.0.1:48921/api/" + $u + $sep + "t=" + $t
            try {
              $r = Invoke-WebRequest -Uri $url -TimeoutSec 75 -UseBasicParsing
              Write-Host ("OK  " + $u + " -> " + $r.Content.Substring(0,[Math]::Min(150,$r.Content.Length))); $ok++
            } catch { Write-Host ("HATA " + $u + " -> " + $_); $hata++ }
          }
          Write-Host "=== PDF KONTROL ==="; if(Test-Path rapor.pdf){ $p=Get-Item rapor.pdf; Write-Host ("PDF: " + $p.Length + " bayt"); $h=Get-Content rapor.pdf -TotalCount 1; Write-Host ("PDF BASLIK: " + $h) } else { Write-Host "PDF YOK" }
          Write-Host "=== PAYLOAD DOSYALARI ==="; Write-Host "=== TANI ==="; if(Test-Path motor.log){ Get-Content motor.log | Select-String "TANI|uclar" | Select-Object -First 3 | Out-String }
          Get-ChildItem payloadlar -ErrorAction SilentlyContinue | Select-Object Name,Length | Format-Table -AutoSize | Out-String
          Write-Host "--- ICERIK BASI ---"; Get-ChildItem payloadlar | ForEach-Object { Write-Host ($_.Name + ": " + (Get-Content $_.FullName -TotalCount 1).Substring(0,[Math]::Min(45,(Get-Content $_.FullName -TotalCount 1).Length))) }
          Write-Host "=== MOTOR CIKTISI ==="; Get-Content motor.log -Tail 20
          Write-Host ("SONUC: OK=" + $ok + " HATA=" + $hata)
          if ($ok -lt 4) { exit 1 }
          Write-Host '--- TUMU TAMAM ---'

      - name: Iki kopya motor testi
        shell: pwsh
        run: |
          $t = Get-Content .sifre -Raw
          $t = $t.Trim()
          Expand-Archive -Path paket.zip -DestinationPath . -Force -ErrorAction SilentlyContinue
          $exe = Get-ChildItem -Recurse -Filter CWPS.exe | Select-Object -First 1
          Write-Host "EXE: $($exe.FullName)"
          $p1 = Start-Process $exe.FullName -PassThru; Start-Sleep -Seconds 12
          $p2 = Start-Process $exe.FullName -PassThru; Start-Sleep -Seconds 12
          foreach ($port in 48921..48930) {
            try { $r = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/durum?t=cwps-yerel-9f3a7d" -TimeoutSec 5
                  Write-Host "PORT $port CEVAP VERDI -> surum $($r.surum)" } catch {}
          }
          Stop-Process -Id $p1.Id,$p2.Id -Force -ErrorAction SilentlyContinue
