name: port
on: [push, workflow_dispatch]
jobs:
  m:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: sifre coz
        shell: pwsh
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in kaynak.enc -out k.tar.gz -k ${{ secrets.PAKET_SIFRE }}
          tar -xzf k.tar.gz
          Get-ChildItem |
      - name: dolu portta motor
        shell: pwsh
        run: |
          $l = New-Object System.Net.Sockets.TcpListener([System.Net.IPAddress]::Parse("127.0.0.1"), 48921)
          $l.Start(); Write-Host "48921 ELLE TUTULDU"
          $p = Start-Process .\CWPS.exe -PassThru
          Start-Sleep -Seconds 15
          foreach ($port in 48921..48926) {
            try { $r = Invoke-RestMethod "http://127.0.0.1:$port/api/durum?t=cwps-yerel-9f3a7d" -TimeoutSec 6
                  Write-Host "PORT $port -> CEVAP: surum=$($r.surum) cve=$($r.cve)" } catch { Write-Host "PORT $port -> kapali" }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
