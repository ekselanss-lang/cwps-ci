name: kurulum-satici
on: [push, workflow_dispatch]
jobs:
  kali:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Kali (kali-rolling) cek ve Linux araclarini kur
        run: |
          docker pull kalilinux/kali-rolling
          docker run --name ck kalilinux/kali-rolling bash -c "apt-get update -y && DEBIAN_FRONTEND=noninteractive apt-get install -y hydra medusa ncrack wifite reaver hcxtools hcxdumptool responder patator sqlmap aircrack-ng nmap netcat-openbsd wordlists && apt-get clean && rm -rf /var/lib/apt/lists/*"
          docker export ck -o kali-rootfs.tar
          ls -la kali-rootfs.tar && du -h kali-rootfs.tar
      - name: Kali rootfs artefakt yukle
        uses: actions/upload-artifact@v4
        with:
          name: kali-rootfs
          path: kali-rootfs.tar
          retention-days: 3
  k:
    needs: kali
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Kaynagi coz
        shell: pwsh
        run: |
          # KURULUM DOSYASI DUZELTMESI: sifreli arsivde ESKI CWPS.iss vardi (keygen'i paketliyordu +
          # sonda onay kutusu acip sessiz kurulumu 45 dk kilitliyordu ✗). Repo'daki DOGRU surum kullanilir ✓
          Copy-Item CWPS.iss CWPS.iss.repo -Force
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in kaynak.enc -out k.tar.gz -k ${{ secrets.PAKET_SIFRE }}
          tar -xzf k.tar.gz
          Copy-Item CWPS.iss.repo CWPS.iss -Force
          Remove-Item CWPS.iss.repo -Force
          Get-ChildItem -File | Select-Object Name,Length | Format-Table -AutoSize | Out-String
      - name: MSYS2 + mingw kur (github sunucusu)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - name: CWPS.exe + Keygen DERLE (github windows - oracle degil)
        shell: msys2 {0}
        run: |
          g++ -O2 -s -mwindows -std=c++17 -static -static-libgcc -static-libstdc++ -DWIN32_LEAN_AND_MEAN -o CWPS.exe dis.cpp motor.cpp -lws2_32 -ladvapi32 -lcrypt32 -lole32 -luuid -lshell32 -liphlpapi -lwininet -lcomctl32 -lgdi32
          g++ -O2 -s -mwindows -std=c++17 -static -static-libgcc -static-libstdc++ -DWIN32_LEAN_AND_MEAN -o CWPS-Keygen.exe keygen_gui.cpp -lcomctl32 -lgdi32 -lcomdlg32 -luser32
          ls -la CWPS.exe CWPS-Keygen.exe
      - name: Surum basligi duzeltmesi (9.8 -> 9.9)
        shell: pwsh
        run: |
          $d = Get-Content dis.cpp -Raw
          $y = $d -replace '<title>CYBERWOLF SECURITY 9\.8</title>','<title>CYBERWOLF SECURITY 9.9</title>'
          if ($y -ne $d) { Set-Content dis.cpp $y -NoNewline; Write-Host "pencere basligi 9.9 yapildi ✓" } else { Write-Host "baslik zaten guncel ✓" }
      - name: Inno Setup kur
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Diller klasoru kontrol (Turkish.isl)
        shell: pwsh
        run: |
          $d="C:\Program Files (x86)\Inno Setup 6\Languages"
          if(Test-Path $d){ (Get-ChildItem $d -Filter *.isl | Select-Object -ExpandProperty Name) -join ", " }
          else { Write-Host "DIL KLASORU YOK" }
      - name: Gomulu araclari indir (8 arac)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path araclar | Out-Null
          foreach ($r in @("subfinder","httpx","naabu","katana","dnsx")) {
            $rel = Invoke-RestMethod "https://api.github.com/repos/projectdiscovery/$r/releases/latest"
            $a = $rel.assets | Where-Object { $_.name -like "*windows_amd64.zip" } | Select-Object -First 1
            Write-Host "$r -> $($a.name)"
            Invoke-WebRequest $a.browser_download_url -OutFile "$r.zip" -UseBasicParsing
            Expand-Archive "$r.zip" -DestinationPath "t_$r" -Force
            $exe = Get-ChildItem "t_$r" -Recurse -Filter "$r.exe" | Select-Object -First 1
            Copy-Item $exe.FullName "araclar\$r.exe" -Force
          }
          Invoke-WebRequest "https://github.com/ffuf/ffuf/releases/download/v2.1.0/ffuf_2.1.0_windows_amd64.zip" -OutFile ffuf.zip -UseBasicParsing
          Expand-Archive ffuf.zip -DestinationPath t_ffuf -Force
          Copy-Item (Get-ChildItem t_ffuf -Recurse -Filter ffuf.exe | Select-Object -First 1).FullName "araclar\ffuf.exe" -Force
          Invoke-WebRequest "https://github.com/OJ/gobuster/releases/download/v3.6.0/gobuster_Windows_x86_64.zip" -OutFile gb.zip -UseBasicParsing
          Expand-Archive gb.zip -DestinationPath t_gb -Force
          Copy-Item (Get-ChildItem t_gb -Recurse -Filter gobuster.exe | Select-Object -First 1).FullName "araclar\gobuster.exe" -Force
          Invoke-WebRequest "https://nmap.org/dist/nmap-7.92-win32.zip" -OutFile nmap.zip -UseBasicParsing
          Expand-Archive nmap.zip -DestinationPath t_nmap -Force
          Copy-Item (Get-ChildItem t_nmap -Recurse -Filter nmap.exe | Select-Object -First 1).FullName "araclar\nmap.exe" -Force
          # ONCE KENDI SUNUCUMUZDAN (hizli + guvenilir), olmazsa GitHub'dan ✓
          try {
            Invoke-WebRequest "https://script.cyberwolfsec.com/indir/araclar/nuclei.exe" -OutFile "araclar\nuclei.exe" -UseBasicParsing
            Write-Host "nuclei kendi sunucumuzdan alindi"
          } catch { Write-Host ("kendi sunucudan alinamadi: " + $_) }
          $ok = Test-Path "araclar\nuclei.exe"
          $ok=$false
          foreach ($v in @("v3.4.10","v3.3.9","v3.3.7","v3.2.9")) {
            if ($ok) { break }
            try {
              $s = $v.TrimStart("v")
              Invoke-WebRequest "https://github.com/projectdiscovery/nuclei/releases/download/$v/nuclei_$s`_windows_amd64.zip" -OutFile nuclei.zip -UseBasicParsing
              Expand-Archive nuclei.zip -DestinationPath t_nuclei -Force
              Copy-Item (Get-ChildItem t_nuclei -Recurse -Filter nuclei.exe | Select-Object -First 1).FullName "araclar\nuclei.exe" -Force
              $ok = Test-Path "araclar\nuclei.exe"
              if ($ok) { Write-Host "nuclei paketlendi ($v)" }
            } catch { Write-Host ("nuclei $v indirilemedi") }
          }
          if (-not $ok) {
            try {
              $n = Invoke-RestMethod "https://api.github.com/repos/projectdiscovery/nuclei/releases/latest"
              $na = $n.assets | Where-Object { $_.name -like "*windows_amd64.zip" } | Select-Object -First 1
              Invoke-WebRequest $na.browser_download_url -OutFile nuclei.zip -UseBasicParsing
              Expand-Archive nuclei.zip -DestinationPath t_nuclei -Force
              Copy-Item (Get-ChildItem t_nuclei -Recurse -Filter nuclei.exe | Select-Object -First 1).FullName "araclar\nuclei.exe" -Force
            } catch { Write-Host ("nuclei API indirilemedi: " + $_) }
          }
          # ZORUNLU KONTROL: 9 aracin hepsi pakete girmeli, eksikse derleme DURUR ✗
          $bekle=@("nmap","ffuf","gobuster","nuclei","subfinder","httpx","naabu","katana","dnsx")
          $eksik=@(); foreach($b in $bekle){ if(-not (Test-Path "araclar\$b.exe")){ $eksik += $b } }
          if($eksik.Count -gt 0){ Write-Host ("EKSIK ARACLAR: " + ($eksik -join ", ")); exit 1 }
          Write-Host ("TAM " + $bekle.Count + " ARAC HAZIR: " + ($bekle -join ", "))
          Write-Host "=== ARAÇLAR ==="
          Get-ChildItem araclar | Select-Object Name,Length | Format-Table -AutoSize | Out-String
      - name: Ek pentest araclari + Metasploit (program icine gomulu)
        shell: pwsh
        run: |
          $ErrorActionPreference="Continue"
          New-Item -ItemType Directory -Force -Path araclar | Out-Null
          $SZ = "C:\Program Files\7-Zip\7z.exe"; if(-not (Test-Path $SZ)){ $SZ = "7z" }
          function A($repo,$pat,$out){ try { $r=Invoke-RestMethod "https://api.github.com/repos/$repo/releases/latest"; $a=$r.assets | Where-Object { $_.name -like $pat } | Select-Object -First 1; if(-not $a){ Write-Host "ATLA $repo ($pat)"; return $false }; Invoke-WebRequest $a.browser_download_url -OutFile $out -UseBasicParsing; return $true } catch { Write-Host ("HATA $repo : " + $_); return $false } }
          # --- 1) hashcat (Windows 7z) ---
          if (A "hashcat/hashcat" "hashcat-*.7z" "hc.7z") {
            & $SZ x hc.7z -ot_hc -y | Out-Null
            $d = Get-ChildItem t_hc -Directory | Select-Object -First 1
            if ($d) { Copy-Item $d.FullName "araclar\hashcat" -Recurse -Force; Write-Host "PASS hashcat" } else { Write-Host "HATA hashcat klasor" }
          }
          # --- 2) amass ---
          if (A "owasp-amass/amass" "amass_windows_amd64.*" "am.tar.gz") {
            New-Item -ItemType Directory -Force -Path t_am | Out-Null
            tar -xzf am.tar.gz -C t_am
            $e = Get-ChildItem t_am -Recurse -Filter amass.exe | Select-Object -First 1
            if ($e) { Copy-Item $e.FullName "araclar\amass.exe" -Force; Write-Host "PASS amass" }
          }
          # --- 3) feroxbuster ---
          if (A "epi052/feroxbuster" "*windows*" "fx.zip") {
            Expand-Archive fx.zip -DestinationPath t_fx -Force
            $e = Get-ChildItem t_fx -Recurse -Filter feroxbuster.exe | Select-Object -First 1
            if ($e) { Copy-Item $e.FullName "araclar\feroxbuster.exe" -Force; Write-Host "PASS feroxbuster" }
          }
          # --- 4) nuclei-templates (nuclei icin ZORUNLU) ---
          try {
            $t = Invoke-RestMethod "https://api.github.com/repos/projectdiscovery/nuclei-templates/releases/latest"
            $ta = $t.assets | Where-Object { $_.name -like "nuclei-templates*.zip" } | Select-Object -First 1
            if ($ta) { Invoke-WebRequest $ta.browser_download_url -OutFile nt.zip -UseBasicParsing; Expand-Archive nt.zip -DestinationPath t_nt -Force }
            else { Invoke-WebRequest ("https://github.com/projectdiscovery/nuclei-templates/archive/refs/tags/" + $t.tag_name + ".tar.gz") -OutFile nt.tgz -UseBasicParsing; New-Item -ItemType Directory -Force -Path t_nt | Out-Null; tar -xzf nt.tgz -C t_nt }
            $d = Get-ChildItem t_nt -Directory | Select-Object -First 1
            if ($d) { Copy-Item $d.FullName "araclar\nuclei-templates" -Recurse -Force; Write-Host "PASS nuclei-templates" }
          } catch { Write-Host ("HATA nuclei-templates: " + $_) }
          # --- 5) John the Ripper (Windows jumbo) ---
          try {
            Invoke-WebRequest "https://www.openwall.com/john/k/john-1.9.0-jumbo-1-win64.zip" -OutFile john.zip -UseBasicParsing
            Expand-Archive john.zip -DestinationPath t_j -Force
            $d = Get-ChildItem t_j -Directory | Select-Object -First 1
            if ($d) { Copy-Item $d.FullName "araclar\john" -Recurse -Force; $jj = Get-ChildItem "araclar\john" -Recurse -Filter john.exe | Select-Object -First 1; if ($jj) { Copy-Item $jj.FullName "araclar\john\john.exe" -Force; Write-Host "PASS john" } }
          } catch { Write-Host ("john HATA: " + $_) }
          # --- 6) sqlmap + gomulu python ---
          try {
            Invoke-WebRequest "https://github.com/sqlmapproject/sqlmap/archive/refs/heads/master.zip" -OutFile sq.zip -UseBasicParsing
            Expand-Archive sq.zip -DestinationPath t_sq -Force
            $d = Get-ChildItem t_sq -Directory | Select-Object -First 1
            if ($d) { Copy-Item $d.FullName "araclar\sqlmap" -Recurse -Force }
            Invoke-WebRequest "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip" -OutFile py.zip -UseBasicParsing
            Expand-Archive py.zip -DestinationPath "araclar\python" -Force
            Write-Host "PASS sqlmap + python"
          } catch { Write-Host ("sqlmap HATA: " + $_) }
          # --- 7) METASPLOIT FRAMEWORK (resmi Windows MSI - butun payload/encoder modulleri icinde) ---
          try {
            Invoke-WebRequest "https://windows.metasploit.com/metasploitframework-latest.msi" -OutFile "araclar\metasploitframework-latest.msi" -UseBasicParsing
            $m = (Get-Item "araclar\metasploitframework-latest.msi").Length/1MB
            Write-Host ("PASS Metasploit MSI " + [math]::Round($m,1) + " MB")
          } catch { Write-Host ("Metasploit HATA: " + $_) }
          # --- 8) WIFI: aircrack-ng (Windows tasima) + Npcap surucu ---
          try {
            Invoke-WebRequest "https://download.aircrack-ng.org/aircrack-ng-1.7-win.zip" -OutFile ac.zip -UseBasicParsing
            Expand-Archive ac.zip -DestinationPath t_ac -Force
            $e = Get-ChildItem t_ac -Recurse -Filter "aircrack-ng.exe" | Select-Object -First 1
            if ($e) { Copy-Item $e.DirectoryName "araclar\aircrack-ng" -Recurse -Force; Write-Host "PASS aircrack-ng" } else { Write-Host "HATA aircrack exe yok" }
          } catch { Write-Host ("aircrack HATA: " + $_) }
          try {
            Invoke-WebRequest "https://npcap.com/dist/npcap-1.79.exe" -OutFile "araclar\npcap-1.79.exe" -UseBasicParsing
            Write-Host "PASS npcap surucu"
          } catch { Write-Host ("npcap HATA: " + $_) }
          # --- 9) WORDLIST paketi (hesap kirma modulu) ---
          New-Item -ItemType Directory -Force -Path listeler | Out-Null
          try { Invoke-WebRequest "https://github.com/brannondorsey/naive-hashcat/releases/download/data/rockyou.txt" -OutFile "listeler\parolalar_rockyou.txt" -UseBasicParsing; Write-Host "PASS rockyou (139MB)" } catch { Write-Host ("rockyou HATA: " + $_) }
          try { Invoke-WebRequest "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Usernames/top-usernames-shortlist.txt" -OutFile "listeler\kullanicilar.txt" -UseBasicParsing; Write-Host "PASS kullanici listesi" } catch { Write-Host ("kullanici HATA: " + $_) }
          # --- 10) SINIR ASAN ARACLAR: hydra (Windows), ncrack, kerbrute, Wireshark/tshark ---
          try {
            Invoke-WebRequest "https://github.com/maaaaz/thc-hydra-windows/releases/download/v9.1/thc-hydra-windows-v9.1.zip" -OutFile hyd.zip -UseBasicParsing
            Expand-Archive hyd.zip -DestinationPath t_hyd -Force
            $e = Get-ChildItem t_hyd -Recurse -Filter hydra.exe | Select-Object -First 1
            if ($e) { Copy-Item $e.DirectoryName "araclar\hydra" -Recurse -Force; Write-Host "PASS hydra (windows)" }
          } catch { Write-Host ("hydra HATA: " + $_) }
          try {
            Invoke-WebRequest "https://github.com/ropnop/kerbrute/releases/download/v1.0.3/kerbrute_windows_amd64.exe" -OutFile "araclar\kerbrute.exe" -UseBasicParsing
            Write-Host "PASS kerbrute"
          } catch { Write-Host ("kerbrute HATA: " + $_) }
          try {
            Invoke-WebRequest "https://github.com/nmap/ncrack/releases/download/0.7/ncrack-0.7-setup.exe" -OutFile "araclar\ncrack-0.7-setup.exe" -UseBasicParsing
            Write-Host "PASS ncrack setup"
          } catch { Write-Host ("ncrack HATA: " + $_) }
          try {
            $pg = Invoke-WebRequest "https://www.wireshark.org/download.html" -UseBasicParsing
            $mm = [regex]::Match($pg.Content, "Wireshark-([0-9.]+)-x64\.exe")
            if ($mm.Success) { Invoke-WebRequest ("https://1.na.dl.wireshark.org/win64/" + $mm.Value) -OutFile "araclar\wireshark-setup.exe" -UseBasicParsing; Write-Host ("PASS wireshark " + $mm.Groups[1].Value) }
            else { Write-Host "ATLA wireshark" }
          } catch { Write-Host ("wireshark HATA: " + $_) }
          # --- 11) WSL KALI: kalilinux/kali-rolling kok dosya sistemi (Linux araclari icin) ---
          try {
            $tok = (Invoke-RestMethod "https://auth.docker.io/token?service=registry.docker.io&scope=repository:kalilinux/kali-rolling:pull").token
            $hdr = @{ Authorization = "Bearer $tok"; Accept = "application/vnd.docker.distribution.manifest.v2+json" }
            $mf = Invoke-RestMethod -Headers $hdr "https://registry-1.docker.io/v2/kalilinux/kali-rolling/manifests/latest"
            Write-Host ("Kali katman sayisi: " + $mf.layers.Count)
            New-Item -ItemType Directory -Force -Path t_kali | Out-Null
            $i = 0
            foreach ($l in $mf.layers) {
              $i++
              $f = "t_kali\l$i.tgz"
              Invoke-WebRequest -Headers $hdr ("https://registry-1.docker.io/v2/kalilinux/kali-rolling/blobs/" + $l.digest) -OutFile $f -UseBasicParsing
              Write-Host ("  katman $i indirildi: " + [math]::Round((Get-Item $f).Length/1MB,1) + " MB")
            }
            # katmanlari sirayla ac (beyaz dosyalari da uygula)
            New-Item -ItemType Directory -Force -Path t_kali/root | Out-Null
            Get-ChildItem t_kali -Filter "l*.tgz" | Sort-Object { [int]($_.BaseName -replace "l","") } | ForEach-Object {
              tar -xzf $_.FullName -C "t_kali/root" 2>$null
              if (Test-Path "t_kali/root/.wh..wh..opq") { Remove-Item "t_kali/root/.wh..wh..opq" -Force -Recurse -ErrorAction SilentlyContinue }
              Get-ChildItem "t_kali/root" -Filter ".wh.*" -Force -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Remove-Item $_.FullName -Force -Recurse -ErrorAction SilentlyContinue }
            }
            # WSL --import icin sade tar
            Push-Location "t_kali/root"
            tar -cf "..\..\araclar\kali-rootfs.tar" .
            Pop-Location
            $mb = [math]::Round((Get-Item "araclar\kali-rootfs.tar").Length/1MB,1)
            Write-Host ("PASS kali rootfs " + $mb + " MB")
          } catch { Write-Host ("KALI HATA: " + $_) }
          Write-Host "=== EK ARACLAR SONU ==="
          Get-ChildItem araclar | Select-Object -ExpandProperty Name

      - name: Kali rootfs indir ve araclar klasorune koy
        uses: actions/download-artifact@v4
        with:
          name: kali-rootfs
      - name: Kali rootfs araclar icine tasi
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path araclar | Out-Null
          if (Test-Path kali-rootfs.tar) { Move-Item kali-rootfs.tar araclar\kali-rootfs.tar -Force; Write-Host ("KALI ROOTFS HAZIR: " + [math]::Round((Get-Item araclar\kali-rootfs.tar).Length/1MB,1) + " MB") }
          else { Write-Host "UYARI: kali rootfs inemedi" }

      - name: KURULUM DERLE (satici)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DSATICI /OOutputSatici CWPS.iss | Select-Object -Last 8
          Get-ChildItem OutputSatici | Select-Object Name,Length | Format-Table -AutoSize | Out-String

      - name: SATICI KURULUM TESTI (TEMIZ MAKINE - takilma var mi)
        shell: pwsh
        run: |
          try { Add-MpPreference -ExclusionPath "C:\SQT" -ErrorAction SilentlyContinue } catch {}
          try { Add-MpPreference -ExclusionPath $env:TEMP -ErrorAction SilentlyContinue } catch {}
          Write-Host "--- DEFENDER TEHDIT KAYDI (varsa AV engelliyor demektir) ---"
          try { $t=Get-MpThreatDetection -ErrorAction SilentlyContinue | Select-Object -Last 5; if($t){ $t | Format-Table -AutoSize | Out-String } else { Write-Host "tehdit yok" } } catch {}
          $s = (Get-ChildItem OutputSatici -Filter *.exe | Select-Object -First 1)
          Write-Host ("PAKET: " + $s.Name + "  " + [Math]::Round($s.Length/1MB,1) + " MB")
          $t0=Get-Date
          $p=Start-Process $s.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/NOCANCEL","/DIR=C:\SQT","/LOG=$env:TEMP\sqt.log" -PassThru
          $bitti=$p.WaitForExit(2700000)   # 45 dk: Defender araclari tararken kurulum uzun surebilir
          $sure=[Math]::Round(((Get-Date)-$t0).TotalSeconds,1)
          if(-not $bitti){
            Write-Host ("FAIL  kurulum 45 dk'da BITMEDI (PID " + $p.Id + ")")
            try { Write-Host "--- DEFENDER KARANTINA ---"; Get-MpThreatDetection -ErrorAction SilentlyContinue | Select-Object -Last 3 | Format-List ThreatName,Resources | Out-String } catch {}
            Write-Host "--- SURECLER ---"; Get-Process | Where-Object { $_.ProcessName -match "CWPS|unins|iu|msedge" } | Select-Object ProcessName,Id | Format-Table -AutoSize | Out-String
            if(Test-Path "$env:TEMP\sqt.log"){ Write-Host "--- INNO LOG SON 20 ---"; Get-Content "$env:TEMP\sqt.log" -Tail 20 }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host ("OK    kurulum TAMAMLANDI (" + $sure + " sn, cikis kodu=" + $p.ExitCode + ")")
          Start-Sleep -Seconds 3
          $ok=0; $hata=0
          if(Test-Path "C:\SQT\CWPS.exe"){ Write-Host "PASS  CWPS.exe var"; $ok++ } else { Write-Host "FAIL  CWPS.exe yok"; $hata++ }
          if(Test-Path "C:\SQT\CWPS-Keygen.exe"){ Write-Host ("PASS  SATICI surumunde keygen VAR (lisans uretici) -> " + [Math]::Round((Get-Item "C:\SQT\CWPS-Keygen.exe").Length/1KB,0) + " KB"); $ok++ } else { Write-Host "FAIL  SATICI surumunde keygen YOK (olmali!)"; $hata++ }
          if(Test-Path "C:\SQT\araclar"){ Write-Host ("PASS  araclar (" + (Get-ChildItem "C:\SQT\araclar" -Filter *.exe).Count + " arac)"); $ok++ } else { Write-Host "FAIL  araclar yok"; $hata++ }
          Write-Host ("TEMIZ MAKINE TESTI: PASS=" + $ok + " HATA=" + $hata)
          if($hata -gt 0){ exit 1 }
