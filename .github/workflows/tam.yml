  @{u="zincir"; p="?h=127.0.0.1&port=19090"}
  @{u="kanit"; p="?h=127.0.0.1"}
  @{u="harici"; p="?arac=nmap&h=127.0.0.1"}
  @{u="dinleyici"; p="?durum=basla&lport=4545"}
  @{u="exploit"; p="?h=127.0.0.1&urun=apache"}
  @{u="gonder"; p="?h=127.0.0.1&port=19090&yol=/lfi&prm=file"}
  @{u="proxy"; p="?h=127.0.0.1&port=19090&yol=/"}
          )
          $ok=0; $bos=0; $hata=0
          foreach ($x in $liste) {
            $u = "http://127.0.0.1:48921/api/" + $x.u + $x.p + ($(if($x.p.Contains("?")){"&"}else{"?"})) + $T
            try {
              $r = Invoke-WebRequest $u -TimeoutSec 100 -UseBasicParsing
              $c = $r.Content
              if ($c.Length -lt 12) { Write-Host ("BOS  " + $x.u + " -> " + $c); $bos++ }
              else { Write-Host ("TAMAM " + $x.u + " (" + $c.Length + " b)"); $ok++ }
            } catch { Write-Host ("HATA " + $x.u + " -> " + $_.Exception.Message); $hata++ }
          }
          Write-Host "OZET: TAMAM=$ok BOS=$bos HATA=$hata"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
