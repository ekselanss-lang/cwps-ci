  @{u="sayfa"; p="?h=127.0.0.1&port=19090&yol=/"}
  @{u="rapor"; p="?h=127.0.0.1"}
  @{u="zafiyet"; p="?h=127.0.0.1&port=19090&yol=/sqli&prm=id"}
  @{u="crawler"; p="?h=127.0.0.1&port=19090&limit=20"}
  @{u="yonlendirme"; p="?h=127.0.0.1&port=19090&yol=/"}
  @{u="csrf"; p="?h=127.0.0.1&port=19090"}
  @{u="api"; p="?h=127.0.0.1&port=19090"}
  @{u="bulut"; p="?h=cyberwolfsec.com"}
  @{u="cms"; p="?h=127.0.0.1&port=19090"}
  @{u="intruder"; p="?h=127.0.0.1&port=19090&yol=/login&prm=user"}
  @{u="sql"; p="?h=127.0.0.1&port=19090&yol=/sqli&prm=id"}
  @{u="modul"; p=""}
  @{u="modulcalistir"; p="?modul=cms_tara&h=127.0.0.1&port=19090"}
  @{u="yuk"; p="?tur=ps1&lhost=127.0.0.1&lport=4444"}
  @{u="raporpdf"; p="?h=127.0.0.1"}
  @{u="lfi"; p="?h=127.0.0.1&port=19090&yol=/lfi&prm=file"}
  @{u="cmdenj"; p="?h=127.0.0.1&port=19090&yol=/cmd&prm=cmd"}
  @{u="sqli"; p="?h=127.0.0.1&port=19090&yol=/sqli&prm=id"}
  @{u="varsayilan"; p="?h=127.0.0.1&port=19090&yol=/login"}
