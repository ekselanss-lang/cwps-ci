name: tam
on: [push, workflow_dispatch]
jobs:
  t:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: coz
        shell: pwsh
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in kaynak.enc -out k.tar.gz -k ${{ secrets.PAKET_SIFRE }}
          tar -xzf k.tar.gz
      - name: A-Z
        shell: pwsh
        run: pwsh -File az.ps1
